<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>FlowBarber</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }

      body {
        align-items: center;
        background: #111111;
        color: #f5efe3;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }

      main {
        max-width: 360px;
      }

      h1 {
        color: #d7a84c;
        font-size: 24px;
        margin: 0 0 12px;
      }

      p {
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FlowBarber</h1>
      <p>Comprueba tu conexión a Internet y vuelve a abrir la aplicación.</p>
    </main>
  </body>
</html>
